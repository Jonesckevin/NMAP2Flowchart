<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b1118" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NMAP2Flowchart – nmap scan to network diagram</title>
    <script>
      // Paint the stored theme and accent before the app boots, so a saved choice
      // does not flash the defaults for a frame.
      try {
        if (localStorage.getItem('nmap2flowchart.canvasTheme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
        const accent = localStorage.getItem('nmap2flowchart.accent');
        if (accent === 'orange' || accent === 'purple') {
          document.documentElement.dataset.accent = accent;
        }
      } catch {
        /* storage blocked: stay with the dark default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
