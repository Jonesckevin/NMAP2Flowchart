name: nmap2flowchart

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nmap2flowchart:latest
    container_name: nmap2flowchart
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: nmap2flowchart-api:latest
    container_name: nmap2flowchart-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - nmap2flowchart-data:/data
      # Optional: a risk policy file the api container can read. Mount it here
      # (read-only is enough) and point NMAP_RISK_POLICY_FILE at the same path.
      # - ./risk-policy.example.json:/data/risk.json:ro
    environment:
      NMAP_AUTH_ENABLED: "${NMAP_AUTH_ENABLED:-false}"
      NMAP_ALLOW_REGISTRATION: "${NMAP_ALLOW_REGISTRATION:-true}"
      NMAP_ALLOW_GUEST: "${NMAP_ALLOW_GUEST:-true}"
      NMAP_SESSION_TTL_HOURS: "${NMAP_SESSION_TTL_HOURS:-720}"
      NMAP_GUEST_TTL_HOURS: "${NMAP_GUEST_TTL_HOURS:-24}"
      NMAP_MAX_PROJECT_MB: "${NMAP_MAX_PROJECT_MB:-16}"
      NMAP_MAX_PROJECTS: "${NMAP_MAX_PROJECTS:-200}"
      NMAP_TRUST_PROXY: "true"
      NMAP_DATA_DIR: /data
      # --- Risk levels shared with every browser (README → “Risk levels”) ------
      # Leave both unset to use the built-in Critical / Medium / Low tiers.
      #
      # NMAP_RISK_LEVELS takes the whole policy inline, as JSON: a bare array of
      # levels or {"levels": [...]}. The array order is the priority — the first
      # level a host matches decides its colour, so red outranks orange.
      # In .env wrap the value in single quotes (it contains spaces and '#'):
      #   NMAP_RISK_LEVELS='[{"label":"Critical","color":"#e5484d","ports":"23, 445, 3389, 3306"},{"label":"Review","color":"#a855f7","ports":"8000-8100, 9000-9100"},{"label":"Web","color":"#e3c53d","ports":"80, 443"}]'
      # The built-in default, spelled out (all levels enabled, no ids needed):
      #   NMAP_RISK_LEVELS=[{"label":"Critical","color":"#e5484d","ports":"21, 23, 69, 111, 135, 139, 445, 512-514, 1433, 1521, 2049, 3306, 3389, 5432, 5900, 5985, 6379, 9200, 11211, 27017"},{"label":"Medium","color":"#f08c2e","ports":"22, 1080, 2375-2376, 3000, 3128, 5000, 5901, 7001, 8000-8100, 8443, 8888, 9090, 10000"},{"label":"Low","color":"#e3c53d","ports":"25, 53, 80, 110, 143, 161, 389, 443, 465, 587, 636, 873, 993, 995, 1900, 5060, 5353"}]
      #
      # NMAP_RISK_POLICY_FILE is the same JSON kept in a file inside the container
      # (the file wins when both are set). Use risk-policy.example.json from this
      # folder: uncomment the volume above and set the path to match:
      #   NMAP_RISK_POLICY_FILE: /data/risk.json
      # Per level: label (shown on the card), color (#rgb or #rrggbb), ports
      # ("21, 23, 512-514" — single ports and ranges, comma or space separated),
      # enabled (default true), id (optional slug, otherwise derived from label).
      NMAP_RISK_LEVELS: "${NMAP_RISK_LEVELS:-}"
      NMAP_RISK_POLICY_FILE: "${NMAP_RISK_POLICY_FILE:-}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  nmap2flowchart-data:
